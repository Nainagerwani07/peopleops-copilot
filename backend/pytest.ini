[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    llm: calls the real LLM API (slow, uses free-tier quota). Run with: pytest -m llm
addopts = -m "not llm"
filterwarnings =
    # test-only LLM cache (conftest.py); swap for our own cache if it breaks
    ignore:`langchain-community` is being sunset:DeprecationWarning
    # passlib (used by the original app) on Python 3.13+; we run 3.11
    ignore:'crypt' is deprecated:DeprecationWarning
